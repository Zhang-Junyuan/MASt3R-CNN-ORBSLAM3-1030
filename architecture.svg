<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="330" viewBox="0 0 1680 330"><rect width="1680" height="330" fill="#f5f8fc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526a87"/></marker></defs><g font-family="Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="23" fill="#172d4c">MASt3R 动态过滤与稀疏地图：当前已实现路径</text><rect x="24" y="75" width="250" height="100" rx="12" fill="white" stroke="#477cb3"/><text x="149" y="111" text-anchor="middle" font-size="20">双帧 RGB</text><text x="149" y="144" text-anchor="middle" font-size="14">标定与尺寸同步</text><path d="M274 125h23" stroke="#526a87" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="75" width="250" height="100" rx="12" fill="white" stroke="#477cb3"/><text x="425" y="111" text-anchor="middle" font-size="20">MASt3R</text><text x="425" y="144" text-anchor="middle" font-size="14">点图 + 24 维描述子 + 置信度</text><path d="M550 125h23" stroke="#526a87" stroke-width="2" marker-end="url(#a)"/><rect x="576" y="75" width="250" height="100" rx="12" fill="white" stroke="#477cb3"/><text x="701" y="111" text-anchor="middle" font-size="20">相机运动补偿</text><text x="701" y="144" text-anchor="middle" font-size="14">鲁棒初始位姿 / 重投影残差</text><path d="M826 125h23" stroke="#526a87" stroke-width="2" marker-end="url(#a)"/><rect x="852" y="75" width="250" height="100" rx="12" fill="white" stroke="#477cb3"/><text x="977" y="111" text-anchor="middle" font-size="20">卷积动态过滤</text><text x="977" y="144" text-anchor="middle" font-size="14">有序 XYZ / RGB / 残差 → Pdyn</text><path d="M1102 125h23" stroke="#526a87" stroke-width="2" marker-end="url(#a)"/><rect x="1128" y="75" width="250" height="100" rx="12" fill="white" stroke="#477cb3"/><text x="1253" y="111" text-anchor="middle" font-size="20">稀疏化与关联</text><text x="1253" y="144" text-anchor="middle" font-size="14">网格选点 + 体素 + 浮点匹配</text><path d="M1378 125h23" stroke="#526a87" stroke-width="2" marker-end="url(#a)"/><rect x="1404" y="75" width="250" height="100" rx="12" fill="white" stroke="#477cb3"/><text x="1529" y="111" text-anchor="middle" font-size="20">ORB-SLAM3 后端</text><text x="1529" y="144" text-anchor="middle" font-size="14">PnP + 位姿优化 + 局部 BA</text><text x="28" y="222" font-size="19">关键帧静态候选稠密点 → 用优化后的关键帧位姿重投影到世界 → 体素融合 → 多视角支持点云</text><text x="28" y="261" font-size="16" fill="#8e4527">边界：卷积模型仅合成训练；不含已适配的词袋回环、IMU 或语义分割；未宣称实时或动态检测精度。</text><text x="28" y="294" font-size="16" fill="#526a87">保留 Atlas / Map / KeyFrame / MapPoint / Optimizer；新增前端直接调用原生 C++ 后端，不调用 ORB 特征提取。</text></g></svg>