<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1480" viewBox="0 0 2700 1480"><rect width="100%" height="100%" fill="#f4f7fc"/><text x="45" y="60" font-family="Microsoft YaHei,sans-serif" font-size="38" fill="#18314d">MASt3R 动态过滤与稀疏 SLAM：已实现的详细框架</text><text x="45" y="103" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#536783">蓝色：学习前端及适配模块    绿色：复用 ORB-SLAM3 地图与优化    橙色：动态点处理    箭头表示数据依赖</text><rect x="45" y="155" width="385" height="245" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="61" y="196" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">① 双帧输入与标定</text><text x="61" y="238" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">上一有效参考帧 Ir</text><text x="61" y="273" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">当前 RGB 图像 It + 内参 K</text><text x="61" y="308" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">初始化等待两张不同图像</text><text x="61" y="343" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">缩放 / 裁剪并同步调整 K</text><rect x="490" y="155" width="385" height="245" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="506" y="196" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">② MASt3R 稠密预测</text><text x="506" y="238" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">共享编码与双视图解码</text><text x="506" y="273" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">点图 Pr、Pt→r：H×W×3</text><text x="506" y="308" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">描述子 Dr、Dt：H×W×24</text><text x="506" y="343" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">几何与描述子置信度</text><rect x="935" y="155" width="385" height="245" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="951" y="196" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">③ 候选与初步关联</text><text x="951" y="238" font-fa