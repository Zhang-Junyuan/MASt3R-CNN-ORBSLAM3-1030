<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="720" viewBox="0 0 2700 720"><rect width="100%" height="100%" fill="#f4f7fc"/><text x="45" y="60" font-family="Microsoft YaHei,sans-serif" font-size="38" fill="#18314d">DynamicPointCNN：输入、卷积结构与过滤决策</text><text x="45" y="103" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#536783">在保留像素邻接关系的有序点图上执行二维卷积；参数总数 3,817；当前模型仅经过合成残差训练</text><rect x="45" y="160" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="61" y="201" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">10 通道输入</text><text x="61" y="243" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">RGB：3；归一化 XYZ：3</text><text x="61" y="278" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">几何置信度：1</text><text x="61" y="313" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">重投影 / 三维残差：各 1</text><text x="61" y="348" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">对应支持度：1</text><rect x="490" y="160" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="506" y="201" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">通道投影</text><text x="506" y="243" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">1×1 Conv</text><text x="506" y="278" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">10 → 24</text><text x="506" y="313" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">ReLU</text><text x="506" y="348" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">保持 H×W 分辨率</text><rect x="935" y="160" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="951" y="201" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">可分离卷积块 1</text><text x="951" y="243" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">3×3 DW，dilation=1</text><text x="951" y="278" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">24 → 24；ReLU</text><text x="951" y="313" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">1×1 PW：24 → 32</text><text x="951" y="348" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">ReLU</text><rect x="1380" y="160" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="1396" y="201" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">可分离卷积块 2</text><text x="1396" y="243" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">3×3 DW，dilation=2</text><text x="1396" y="278" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">32 → 32；ReLU</text><text x="1396" y="313" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">1×1 PW：32 → 32</text><text x="1396" y="348" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">ReLU</text><rect x="1825" y="160" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="1841" y="201" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">可分离卷积块 3</text><text x="1841" y="243" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">3×3 DW，dilation=4</text><text x="1841" y="278" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">32 → 32；ReLU</text><text x="1841" y="313" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">1×1 PW：32 → 24</text><text x="1841" y="348" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">ReLU</text><rect x="2270" y="160" width="385" height="250" rx="14" fill="#fff0dc" stroke="#6386ac" stroke-width="2"/><text x="2286" y="201" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">概率头与后处理</text><text x="2286" y="243" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">1×1 Conv：24 → 1</text><text x="2286" y="278" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">Sigmoid → 动态风险概率</text><text x="2286" y="313" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">首帧 / 无支持区域：未知</text><text x="2286" y="348" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">候选过滤阈值：0.65</text><polyline points="430,285 490,285" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="490,285 475.0,278.0 475.0,292.0" fill="#486b92"/><polyline points="875,285 935,285" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="935,285 920.0,278.0 920.0,292.0" fill="#486b92"/><polyline points="1320,285 1380,285" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1380,285 1365.0,278.0 1365.0,292.0" fill="#486b92"/><polyline points="1765,285 1825,285" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1825,285 1810.0,278.0 1810.0,292.0" fill="#486b92"/><polyline points="2210,285 2270,285" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="2270,285 2255.0,278.0 2255.0,292.0" fill="#486b92"/><rect x="45" y="475" width="1260" height="180" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="61" y="516" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">为什么需要相机运动补偿</text><text x="61" y="558" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">相机移动会使静态背景在图像中移动。用初步相机位姿解释刚体运动，</text><text x="61" y="593" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">把未被该模型解释的残差及三维一致性线索交给 CNN，预测运动风险。</text><rect x="1360" y="475" width="1295" height="180" rx="14" fill="#fff0dc" stroke="#6386ac" stroke-width="2"/><text x="1376" y="516" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">概率的使用范围</text><text x="1376" y="558" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">当前候选点：高风险点不参与最终位姿估计和当前点云融合。</text><text x="1376" y="593" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">已建地图点：更高阈值并结合两类几何证据，才撤销地图观测关联。</text></svg>