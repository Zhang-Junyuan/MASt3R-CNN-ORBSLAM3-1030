idth="385" height="205" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="2286" y="541" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">轨迹及两类地图</text><text x="2286" y="583" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">最终位姿更新稠密融合</text><text x="2286" y="618" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">稀疏地图 + 稠密点云</text><polyline points="430,602 490,602" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="490,602 475.0,595.0 475.0,609.0" fill="#486b92"/><polyline points="875,602 935,602" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="935,602 920.0,595.0 920.0,609.0" fill="#486b92"/><polyline points="1320,602 1380,602" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1380,602 1365.0,595.0 1365.0,609.0" fill="#486b92"/><polyline points="1765,602 1825,602" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1825,602 1810.0,595.0 1810.0,609.0" fill="#486b92"/><polyline points="2210,602 2270,602" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="2270,602 2255.0,595.0 2255.0,609.0" fill="#486b92"/><text x="45" y="438" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#18314d">替换：图像观测与匹配机制；复用：地图、位姿优化与 BA；新增：动态过滤、学习特征历史验证与稠密融合。</text><rect x="45" y="795" width="2610" height="135" rx="14" fill="#fff0dc" stroke="#6386ac" stroke-width="2"/><text x="61" y="836" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">实际实现范围</text><text x="61" y="878" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">纯视觉串行控制器已接通；重定位与回环均要求真实匹配及几何验证。网络训练精度、实时性与任意尺度闭环仍需进一步研究。</text></svg>