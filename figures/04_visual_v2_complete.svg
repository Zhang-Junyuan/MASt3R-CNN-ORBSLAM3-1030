56" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">⑧ 最终位姿估计</text><text x="506" y="598" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">地图点 3D–当前像素 2D</text><text x="506" y="633" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">PnP-RANSAC 去除错误匹配</text><text x="506" y="668" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">原生 PoseOptimization</text><text x="506" y="703" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">内点检查 → TRACKING / LOST</text><rect x="935" y="515" width="385" height="250" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="951" y="556" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">⑨ 关键帧与地图维护</text><text x="951" y="598" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">Atlas / Map / KeyFrame</text><text x="951" y="633" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">MapPoint 与共视观测维护</text><text x="951" y="668" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">可信新点入图；重复点融合</text><text x="951" y="703" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">单一控制器串行修改地图</text><rect x="1380" y="515" width="385" height="250" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="1396" y="556" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">⑩ 局部几何优化</text><text x="1396" y="598" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">原生 LocalBundleAdjustment</text><text x="1396" y="633" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">优化关键帧位姿与稀疏点</text><text x="1396" y="668" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">优化结果用于轨迹与参考更新</text><text x="1396" y="703" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">动态撤销 / 融合更新观测</text><rect x="1825" y="515" width="385" height="250" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="1841" y="556" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">(11) 关键帧稠密融合</text><text x="1841" y="598" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">点图转换到当前相机坐标系</text><text x="1841" y="633" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">按最终关键帧位姿变换到世界</text><text x="1841" y="668" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">4 cm 体素及颜色融合</text><text x="1841" y="703" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">另输出 ≥2 关键帧支持点</text><rect x="2270" y="515" width="385" height="250" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="2286" y="556" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">(12) 结果与参考反馈</text><text x="2286" y="598" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">有效位姿 / 关键帧轨迹</text><text x="2286" y="633" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">稀疏地图 / 两类稠密点云</text><text x="2286" y="668" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">回环事件 / 重定位 / BA 日志</text><text x="2286" y="703" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">更新参考 RGB、点 ID、3D、Tcw</text><polyline points="430,640 490,640" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="490,640 475.0,633.0 475.0,647.0" fill="#486b92"/><polyline points="875,640 935,640" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="935,640 920.0,633.0 920.0,647.0" fill="#486b92"/><polyline points="1320,640 1380,640" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1380,640 1365.0,633.0 1365.0,647.0" fill="#486b92"/><polyline points="1765,640 1825,640" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1825,640 1810.0,633.0 1810.0,647.0" fill="#486b92"/><polyline points="2210,640 2270,640" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="2270,640 2255.0,633.0 2255.0,647.0" fill="#486b92"/><polyline points="2462,400 2462,445 25,445 25,640 45,640" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="45,640 30.0,633.0 30.0,647.0" fill="#486b92"/><text x="45" y="843" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#18314d">历史检索支路：跟踪失败时用于重定位；正常跟踪时周期性检查历史回访</text><rect x="45" y="880" width="615" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="61" y="921" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">(13) 历史关键帧检索</text><text x="61" y="963" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">24 维描述子均值归一化</text><text x="61" y="998" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">紧凑签名 L2 排序，取前 5 个</text><text x="61" y="1033" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">重定位：可检索全部关键帧</text><text x="61" y="1068" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">回环：排除近期关键帧</text><rect x="710" y="880" width="615" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="726" y="921" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">(14) 局部匹配与几何验证</text><text x="726" y="963" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">当前帧 ↔ 历史关键帧特征</text><text x="726" y="998" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">浮点 L2 / ratio / 双向一致性</text><text x="726" y="1033" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">历史地图点 PnP-RANSAC</text><text x="726" y="1068" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">内点数 / 比例 / 空间覆盖验证</text><rect x="1375" y="880" width="615" height="250" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="1391" y="921" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">(15) LOST → 重定位恢复</text><text x="1391" y="963" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">使用几何验证通过的历史关联</text><text x="1391" y="998" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">重新运行原生位姿优化</text><text x="1391" y="1033" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">恢复参考关系并插入关键帧</text><text x="1391" y="1068" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">失败则保留旧参考继续尝试</text><rect x="2040" y="880" width="615" height="250" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="2056" y="921" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">(16) TRACKING → 回环校正</text><text x="2056" y="963" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">验证历史位姿与当前估计一致</text><text x="2056" y="998" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">融合几何一致的重复地图点</text><text x="2056" y="1033" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">增加共享观测与关键帧回环边</text><text x="2056" y="1068" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">原生全局 BA 校正位姿与地图</text><polyline points="660,1005 710,1005" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="710,1005 695.0,998.0 695.0,1012.0" fill="#486b92"/><polyline points="1325,1005 1375,1005" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1375,1005 1360.0,998.0 1360.0,1012.0" fill="#486b92"/><polyline points="1325,1100 1350,1100 1350,1170 2347,1170 2347,1130" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="2347,1130 2340.0,1145.0 2354.0,1145.0" fill="#486b92"/><polyline points="682,765 682,850 352,850 352,880" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="352,880 359.0,865.0 345.0,865.0" fill="#486b92"/><polyline points="1682,1130 1682,1200 1250,1200 1250,1260" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="1250,1260 1257.0,1245.0 1243.0,1245.0" fill="#486b92"/><polyline points="2347,1130 2347,1200 2060,1200 2060,1260" fill="none" stroke="#486b92" stroke-width="4"/><polygon points="2060,1260 2067.0,1245.0 2053.0,1245.0" fill="#486b92"/><rect x="45" y="1260" width="1250" height="165" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="61" y="1301" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">稀疏地图与轨迹的一致更新</text><text x="61" y="1343" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">共享 MapPoint 观测把历史与当前关键帧接入同一优化图。</text><text x="61" y="1378" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">融合旧点后跟随替换 ID；轨迹按参考关键帧的最终位姿导出。</text><rect x="1350" y="1260" width="1305" height="165" rx="14" fill="#e7f5ec" stroke="#6386ac" stroke-width="2"/><text x="1366" y="1301" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">稠密地图随优化结果更新</text><text x="1366" y="1343" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">保存的是关键帧局部相机点云；回环 / BA 后重新使用最终位姿融合。</text><text x="1366" y="1378" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">避免把世界坐标中的旧点云再次施加位姿修正，造成双重变换。</text><text x="45" y="1497" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">核心区分：初步 PnP 提供运动补偿；过滤后的地图点 PnP 与位姿优化决定最终定位。</text><text x="45" y="1545" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#18314d">当前控制器串行调用原生位姿优化、局部 BA、全局 BA；原版 ORB 二进制词袋与三个工作线程不在此路径运行。</text><rect x="45" y="1580" width="2610" height="100" rx="14" fill="#fff0dc" stroke="#6386ac" stroke-width="2"/><text x="61" y="1621" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">验证边界</text><text x="61" y="1663" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">动态 CNN 仍为合成初始模型；回环为有界位姿差的几何验证 + 全局 BA，未实现任意尺度 Sim3 / 多地图合并。</text></svg>