<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1710" viewBox="0 0 2700 1710"><rect width="100%" height="100%" fill="#f4f7fc"/><text x="45" y="60" font-family="Microsoft YaHei,sans-serif" font-size="38" fill="#18314d">纯视觉 MASt3R 动态 SLAM：完整运行链路（V2）</text><text x="45" y="103" font-family="Microsoft YaHei,sans-serif" font-size="23" fill="#536783">仅 RGB 与相机内参；学习前端 + ORB-SLAM3 原生地图 / 优化；新增浮点局部地图跟踪、历史重定位与回环调度</text><rect x="45" y="150" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="61" y="191" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">① RGB 双帧与标定</text><text x="61" y="233" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">参考 RGB + 当前 RGB + K</text><text x="61" y="268" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">等待两张图像完成初始化</text><text x="61" y="303" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">缩放 / 裁剪同步调整 K</text><text x="61" y="338" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">上一有效帧作为参考</text><rect x="490" y="150" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="506" y="191" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">② MASt3R 稠密预测</text><text x="506" y="233" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">参考坐标系下的双视图点图</text><text x="506" y="268" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">每像素 24 维浮点描述子</text><text x="506" y="303" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">几何与描述子置信度</text><text x="506" y="338" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">已有地图点锚定配对尺度</text><rect x="935" y="150" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="951" y="191" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">③ 初步几何补偿</text><text x="951" y="233" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">8×8 网格按联合评分选点</text><text x="951" y="268" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">L2 / ratio / 双向匹配</text><text x="951" y="303" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">PnP-RANSAC 初始运动</text><text x="951" y="338" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">计算重投影与三维残差</text><rect x="1380" y="150" width="385" height="250" rx="14" fill="#fff0dc" stroke="#6386ac" stroke-width="2"/><text x="1396" y="191" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">④ 有序点图动态 CNN</text><text x="1396" y="233" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">RGB 3 + 归一化 XYZ 3</text><text x="1396" y="268" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">置信度 1 + 两类残差各 1</text><text x="1396" y="303" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">匹配支持度 1，共 10 通道</text><text x="1396" y="338" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">深度可分离卷积 → Pdyn</text><rect x="1825" y="150" width="385" height="250" rx="14" fill="#fff0dc" stroke="#6386ac" stroke-width="2"/><text x="1841" y="191" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">⑤ 风险过滤与地图清理</text><text x="1841" y="233" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">Pdyn &gt; 0.65：过滤候选点</text><text x="1841" y="268" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">置信度 / 有效深度检查</text><text x="1841" y="303" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">未知区域不作确定动态判断</text><text x="1841" y="338" font-family="Microsoft YaHei,sans-serif" font-size="22" fill="#18314d">强动态证据撤销旧地图点</text><rect x="2270" y="150" width="385" height="250" rx="14" fill="#e9f2ff" stroke="#6386ac" stroke-width="2"/><text x="2286" y="191" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#18314d">⑥ 稀疏观测封装</text><text